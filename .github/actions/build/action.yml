name: Build the plugin
description: Installs the toolchains, then builds and packages the plugin. Optionally checks it first.

inputs:
  checks:
    description: Run the type check, format check, lint and tests, and build the importer, before building.
    default: "false"
  version:
    description: Build as this version. The package.json change is not committed.
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: Set the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm pkg set version="$VERSION"

    # The browser builds use `cargo +nightly`.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown --no-self-update

    - uses: Swatinem/rust-cache@v2

    - if: inputs.checks == 'true'
      shell: bash
      run: |
        pnpm run typecheck
        pnpm run format:check
        pnpm run lint
        pnpm run test
        CARGO_PROFILE_RELEASE_DEBUG=0 cargo +nightly build --release --target wasm32-unknown-unknown -p webimport --target-dir target/wasm-import

    # build: Wine's DLLs (scripts/system32.sh) and the runtime; build:host: the entry module, the
    # worker and plugin.json; package: the plugin directory, in plugin/.
    - shell: bash
      run: |
        pnpm run build
        pnpm run build:host
        pnpm run package
